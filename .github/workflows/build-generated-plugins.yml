name: Build generated plugin files

on:
  push:
    branches:
      - develop
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/**"
      - "docs/plugins/**"
      - "docs/archive/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --save-text-lockfile

      - name: Use current esbuild on GitHub Actions
        run: |
          npm install --no-save --no-audit --no-fund esbuild@^0.27.3
          node -e 'const esbuild = require("esbuild"); const host = esbuild.version; const binary = require("child_process").execFileSync(require.resolve("esbuild/bin/esbuild"), ["--version"], {encoding: "utf8"}).trim(); if (host !== binary) throw new Error(`esbuild host ${host} does not match binary ${binary}`); console.log(`esbuild ${host}`);'

      - name: Run focused tests
        run: node --test src/plugins/PermissionsViewer/index.test.mjs scripts/publish.test.mjs

      - name: Build all plugins
        shell: bash
        run: |
          set -euo pipefail
          for dir in src/plugins/*; do
            [ -f "$dir/config.ts" ] || continue
            bun scripts/build.ts "$(basename "$dir")"
          done

      - name: Prepare and publish distribution
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop master
          node scripts/publish.mjs fresh "$GITHUB_WORKSPACE" "$SOURCE_SHA" origin/develop
          master_dir="$(mktemp -d)"
          stage_dir="$(mktemp -d)"
          git worktree add --detach "$master_dir" origin/master
          node scripts/publish.mjs stage "$GITHUB_WORKSPACE" "$master_dir" "$stage_dir" "$SOURCE_SHA" "$REPOSITORY"
          node scripts/publish.mjs apply "$master_dir" "$stage_dir"
          git -C "$master_dir" add -A
          if git -C "$master_dir" diff --cached --quiet; then
            echo "Distribution already matches source commit $SOURCE_SHA."
            exit 0
          fi
          git -C "$master_dir" commit -m "Publish plugins from $SOURCE_SHA"
          git fetch origin develop
          node scripts/publish.mjs fresh "$GITHUB_WORKSPACE" "$SOURCE_SHA" origin/develop
          git -C "$master_dir" push origin HEAD:master
